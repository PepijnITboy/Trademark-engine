services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trademark
      POSTGRES_PASSWORD: trademark
      POSTGRES_DB: trademark_engine
    ports:
      - "5433:5432"
    volumes:
      - trademark_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademark -d trademark_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  phonetic-service:
    build:
      context: ./services/phonetic-service
    ports:
      - "8091:8091"
    profiles: ["phonetics"]

volumes:
  trademark_pg:
